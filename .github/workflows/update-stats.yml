name: Update GitHub Profile Stats

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest stats SVGs
        run: |
          mkdir -p assets
          curl -s "https://github-readme-stats-fast.vercel.app/api?username=juanxaviercasa&show_icons=true&theme=radical&hide_border=true&bg_color=140f2d&title_color=f39c12&icon_color=e74c3c&text_color=ffffff" -o "assets/github-stats.svg"
          curl -s "https://github-readme-stats-fast.vercel.app/api/top-langs/?username=juanxaviercasa&layout=compact&theme=radical&hide_border=true&bg_color=140f2d&title_color=f39c12&text_color=ffffff" -o "assets/top-langs.svg"
          curl -s "https://streak-stats.demolab.com/?user=juanxaviercasa&theme=radical&hide_border=true&background=140f2d&ring=f39c12&fire=e74c3c&currStreakLabel=f39c12" -o "assets/github-streak.svg"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No changes in stats SVGs."
          else
            git commit -m "chore(stats): update profile metrics and activity SVGs [skip ci]"
            git push
          fi
